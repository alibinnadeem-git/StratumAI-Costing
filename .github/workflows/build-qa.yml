name: Build QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
      DIRECT_URL: postgresql://build:build@127.0.0.1:5432/build
      AUTH_SECRET: ci-build-only-placeholder-secret
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee install.log

      - name: Build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Publish build QA result
        if: always() && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Automated build diagnostic for commit \`${GITHUB_SHA}\`."
            echo
            echo "Install outcome: **${{ steps.install.outcome }}**"
            echo "Build outcome: **${{ steps.build.outcome }}**"
            echo
            echo '```text'
            if [ -f install.log ]; then tail -120 install.log; fi
            if [ -f build.log ]; then tail -240 build.log; fi
            echo '```'
          } > build-diagnostic.md
          gh issue create --title "Build QA result ${GITHUB_SHA:0:7}" --body-file build-diagnostic.md

      - name: Enforce build success
        if: steps.install.outcome != 'success' || steps.build.outcome != 'success'
        run: exit 1
